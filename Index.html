<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corona de Pizzas | Pizzas artesanales a domicilio</title>
<meta name="description" content="Corona de Pizzas: ocho pizzas artesanales hechas al momento, con queso de verdad y entrega a domicilio. Conoce nuestros productos, precios, contacto y ubicación.">
<meta name="keywords" content="corona de pizzas, pizzas, pizza artesanal, pizza a domicilio, pizzería, comida rápida, pizza con queso">
<style>
:root{--bg:#fff8ee;--surface:#ffffff;--text:#2b1b12;--muted:#6b5546;--red:#c62828;--gold:#f4b400;--line:#ecdcc6;--hero:#c62828;--hero-text:#fff8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--surface:#2a1e17;--text:#f6ebdd;--muted:#c9b6a2;--red:#ef5350;--line:#3d2d22;--hero:#8e1f1f;--hero-text:#fff3e0}}
:root[data-theme="dark"]{--bg:#1c1410;--surface:#2a1e17;--text:#f6ebdd;--muted:#c9b6a2;--red:#ef5350;--line:#3d2d22;--hero:#8e1f1f;--hero-text:#fff3e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;line-height:1.6}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:14px}
nav a{color:var(--text);text-decoration:none;font-weight:600}
header{background:var(--hero);color:var(--hero-text);text-align:center;padding:56px 20px 64px}
header .crown{font-size:56px;line-height:1}
h1{font-size:clamp(34px,8vw,56px);margin:8px 0;letter-spacing:.5px}
header p{max-width:560px;margin:0 auto 22px;font-size:18px}
.btn{display:inline-block;background:var(--gold);color:#2b1b12;padding:12px 26px;border-radius:30px;font-family:system-ui,sans-serif;font-weight:700}
section{max-width:960px;margin:0 auto;padding:48px 20px}
h2{color:var(--red);font-size:30px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:14px}
.price{display:block;margin-top:10px;font-family:system-ui,sans-serif;font-weight:700;color:var(--red)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-family:system-ui,sans-serif}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px;overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.map{background:var(--surface);border:2px dashed var(--line);border-radius:14px;min-height:160px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px}
.pz{width:84px;height:84px;display:block;margin:0 auto 8px}.card .pz+h3{text-align:center}.card .pz~p{text-align:center}
footer{text-align:center;padding:26px 16px 36px;color:var(--muted);font-family:system-ui,sans-serif;font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<nav>
